# Nightly data refresh. TEMPLATE: copy this file to `.github/workflows/nightly.yml` in ShroudedArrow/undead-311-data
# (agents have no access to that repo). REQ-OPS-NIGHTLY.1 to .4, REQ-OPS-ALERT.1. Setup steps: ops/undead-311-data/README.md.
#
# Flow (fix/fulldata-2): the pipeline does NOT run here. Each full-data run publishes its exports as a release asset of this
# repo (`exports-<run_id>`: pipeline/scripts/exports_release.py publish). This job checks out the judged repo at the frozen
# release tag, copies judge mode's files from the tag into web/public/data/frozen/ (so judge mode stays on the judging snapshot),
# downloads the newest `exports-*` release asset, verifies its SHA-256 and manifest, unpacks it into web/public/data/, builds the
# site with it and deploys the WHOLE site to Netlify (so data is always served from the site's own origin). The deploy is the
# last step that changes anything public, and a failed night never reaches it, so Netlify keeps the last good deploy. On failure the job writes a failure entry (kept in the release
# `nightly-state`, merged into the next good deploy's status.json `history`) and opens a needs-human alert.
#
# Deploy in two steps (REQ-OPS-NIGHTLY.5): `netlify deploy --no-build` WITHOUT --prod uploads web/dist as a draft and prints its
# URL, ops/undead-311-data/smoke_test.py checks the draft, and only when it passes does `netlify deploy --no-build --prod` publish
# the same files (Netlify has them already, so that step uploads next to nothing). --no-build matters: without it the CLI runs the
# project's build command again (15 minutes) after this job has already built the site. A failed smoke test stops the job before
# production and the failure steps below record it and alert.
#
# Every action is pinned to a tag and the job sets its own permissions (pipeline/tests/unit/test_workflows_pinned.py).
# The actions are on Node 24 majors (checkout, setup-node and setup-uv v7), which clears the Node 20 deprecation warning.
# Every repo script runs from the judged checkout as `uv run --locked python <script>`, never as bare `python3`: the runner's
# python has none of the checkout's dependencies (duckdb, jsonschema), and `--locked` fails the step instead of quietly
# re-resolving when uv.lock and pyproject.toml disagree. This works for any tag, old or new, because it needs nothing from the
# tag except the scripts it already has (test_nightly_template.py).
# Event and variable data reaches scripts through env vars, never inside run text. Secrets used here: NETLIFY_AUTH_TOKEN,
# NETLIFY_SITE_ID (deploy step only) and CHANNEL_TOKEN (alert only), mapped to GITHUB_CHANNEL_TOKEN. The release download uses
# the job's own github.token (same repo), so it needs no extra secret.
name: nightly

on:
  schedule:
    - cron: "41 3 * * *"   # nightly, 03:41 UTC
  workflow_dispatch:

permissions: {}

# One nightly run at a time: a manual run and the scheduled run share this group, so the second waits for the first to finish
# (cancel-in-progress is false, so a running deploy is never cut off). GitHub keeps one waiting run per group; a third request
# replaces the waiting one.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh (download exports, build, deploy)
    runs-on: ubuntu-24.04
    # The two deploy steps have their own 60-minute limit, so the job limit has to be higher than both together would need.
    timeout-minutes: 120
    # contents: write is for the failure history in the `nightly-state` release. The exports release is only read.
    permissions:
      contents: write
    env:
      JUDGED_REPO: ShroudedArrow/undead-311
      # A repository variable (Settings, Secrets and variables, Actions, Variables), set once to the freeze tag.
      JUDGED_TAG: ${{ vars.JUDGED_TAG }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DATA_REPO: ${{ github.repository }}
    steps:
      - name: Require the frozen tag
        id: tag
        run: |
          if [ -z "$JUDGED_TAG" ]; then echo "Set the repository variable JUDGED_TAG to the frozen release tag (README.md)." >&2; exit 1; fi

      - name: Check out the judged repo at the frozen tag
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: ShroudedArrow/undead-311
          ref: ${{ vars.JUDGED_TAG }}
          path: judged

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: judged/.nvmrc
          cache: npm
          cache-dependency-path: judged/web/package-lock.json

      # `uv sync --locked` and `npm ci` install exactly what uv.lock and package-lock.json say (`make setup` runs the unlocked
      # `uv sync` and `npm install`, which can re-resolve on the runner).
      - name: Install dependencies
        id: setup
        working-directory: judged
        run: |
          mkdir -p "$UV_CACHE_DIR"
          uv sync --locked
          npm --prefix web ci

      # Judge mode stays on the judging snapshot (REQ-OPS-SNAP.2). The unpacked exports rewrite stats/judge_tour.json,
      # points.json and the card shards, so judge mode's copy is taken from the tag first, into web/public/data/frozen/
      # (a folder the exports never touch), and only if each file matches data/SNAPSHOT.md.
      - name: Freeze the judge-mode files from the tag
        id: freeze
        working-directory: judged
        run: uv run --locked python pipeline/scripts/snapshot.py --freeze-judge

      # The newest `exports-*` release of this repo, by creation date (a run that did not pass its own checks is never published:
      # `exports_release.py pack` refuses a status that is not ok or carries a DRY RUN ONLY anomaly).
      - name: Download the newest exports release asset
        id: download
        working-directory: judged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(uv run --locked python pipeline/scripts/exports_release.py latest --repo "$DATA_REPO")"
          echo "exports release: $tag"
          mkdir -p "$RUNNER_TEMP/exports"
          gh release download "$tag" --repo "$DATA_REPO" --dir "$RUNNER_TEMP/exports" --pattern "exports-*.tar.gz" --pattern "exports-*.sha256" --clobber

      - name: Verify and unpack the exports
        id: exports
        working-directory: judged
        run: |
          uv run --locked python pipeline/scripts/exports_release.py unpack --archive "$(ls "$RUNNER_TEMP"/exports/exports-*.tar.gz)" --sha256 "$(ls "$RUNNER_TEMP"/exports/exports-*.sha256)" --dest web/public/data

      # Exports whose status says `ok: false` (or no status) must never be deployed.
      - name: Check the pipeline status
        id: check
        working-directory: judged
        run: uv run --locked python ops/undead-311-data/status_history.py check --status web/public/data/status.json

      # The merged status.json is validated against schemas/status.schema.json, which defines `history`.
      - name: Merge earlier failures into status.json history
        id: history
        working-directory: judged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly-state --repo "$DATA_REPO" --pattern failure-history.json --dir "$RUNNER_TEMP" --clobber || echo "no failure history yet"
          uv run --locked python ops/undead-311-data/status_history.py merge --status web/public/data/status.json --history "$RUNNER_TEMP/failure-history.json" --schema schemas/status.schema.json

      # REQ-WEB-LINKS.2 (UX-39): share images need a browser. It is installed inside this step, so a failure is recorded as `build`,
      # and SHARE_IMAGES=required fails the build if no browser starts.
      - name: Build the site with the new data
        id: build
        working-directory: judged
        env:
          SHARE_IMAGES: required
          # Optional repository variable: the site's address, so the share images' Open Graph URLs are absolute. Empty keeps them relative.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm --prefix web exec playwright install --with-deps chromium
          make build

      # What is about to ship must still carry the snapshot's judge-mode files, byte for byte.
      - name: Verify the frozen judge-mode files in the built site
        id: verify
        working-directory: judged
        run: uv run --locked python pipeline/scripts/snapshot.py --check-frozen --public web/dist/data

      # A draft deploy (no --prod): the site is uploaded under its own URL and production is not touched.
      - name: Deploy a draft (no production)
        id: draft
        working-directory: judged
        timeout-minutes: 60
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27.19.0 deploy --no-build --dir web/dist --json --message "nightly draft $GITHUB_RUN_ID" > "$RUNNER_TEMP/draft.json"
          url="$(jq -r '.deploy_url // empty' "$RUNNER_TEMP/draft.json")"
          if [ -z "$url" ]; then echo "The draft deploy printed no deploy_url." >&2; exit 1; fi
          echo "draft: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The draft must look right before it can go live: see the docstring of smoke_test.py for the checks.
      - name: Smoke test the draft
        id: smoke
        working-directory: judged
        timeout-minutes: 10
        env:
          DRAFT_URL: ${{ steps.draft.outputs.url }}
        run: |
          uv run --locked python ops/undead-311-data/smoke_test.py --base-url "$DRAFT_URL" --archive "$(ls "$RUNNER_TEMP"/exports/exports-*.tar.gz)" --public web/public/data --judging data/judging

      # Only reached when the smoke test passed. The files are already on Netlify, so this publishes them without uploading again.
      - name: Deploy the whole site (production)
        id: deploy
        working-directory: judged
        timeout-minutes: 60
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.19.0 deploy --no-build --prod --dir web/dist --message "nightly $GITHUB_RUN_ID"

      - name: Clear the failure history (the deploy that carries it succeeded)
        id: clear
        working-directory: judged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python ops/undead-311-data/status_history.py clear --history "$RUNNER_TEMP/failure-history.json"
          gh release view nightly-state --repo "$DATA_REPO" > /dev/null 2>&1 || gh release create nightly-state --repo "$DATA_REPO" --title "nightly state" --notes "Failure history for the nightly refresh. Not a data release."
          gh release upload nightly-state "$RUNNER_TEMP/failure-history.json" --repo "$DATA_REPO" --clobber

      # ---- failure path: the last good deploy stays up; record the failure and alert the team -----------------
      - name: Record the failure for the next good deploy
        if: ${{ failure() }}
        continue-on-error: true
        working-directory: judged
        env:
          GH_TOKEN: ${{ github.token }}
          S_TAG: ${{ steps.tag.outcome }}
          S_CHECKOUT: ${{ steps.checkout.outcome }}
          S_SETUP: ${{ steps.setup.outcome }}
          S_FREEZE: ${{ steps.freeze.outcome }}
          S_DOWNLOAD: ${{ steps.download.outcome }}
          S_EXPORTS: ${{ steps.exports.outcome }}
          S_CHECK: ${{ steps.check.outcome }}
          S_HISTORY: ${{ steps.history.outcome }}
          S_BUILD: ${{ steps.build.outcome }}
          S_VERIFY: ${{ steps.verify.outcome }}
          S_DRAFT: ${{ steps.draft.outcome }}
          S_SMOKE: ${{ steps.smoke.outcome }}
          S_DEPLOY: ${{ steps.deploy.outcome }}
          S_CLEAR: ${{ steps.clear.outcome }}
        run: |
          gh release download nightly-state --repo "$DATA_REPO" --pattern failure-history.json --dir "$RUNNER_TEMP" --clobber || echo "no failure history yet"
          uv run --locked python ops/undead-311-data/status_history.py record --history "$RUNNER_TEMP/failure-history.json" --run-url "$RUN_URL" --outcomes "tag=$S_TAG" "checkout=$S_CHECKOUT" "setup=$S_SETUP" "freeze=$S_FREEZE" "download=$S_DOWNLOAD" "exports=$S_EXPORTS" "check=$S_CHECK" "history=$S_HISTORY" "build=$S_BUILD" "verify=$S_VERIFY" "draft=$S_DRAFT" "smoke=$S_SMOKE" "deploy=$S_DEPLOY" "clear=$S_CLEAR"
          gh release view nightly-state --repo "$DATA_REPO" > /dev/null 2>&1 || gh release create nightly-state --repo "$DATA_REPO" --title "nightly state" --notes "Failure history for the nightly refresh. Not a data release."
          gh release upload nightly-state "$RUNNER_TEMP/failure-history.json" --repo "$DATA_REPO" --clobber

      - name: Open a needs-human alert in the channel
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GITHUB_CHANNEL_TOKEN: ${{ secrets.CHANNEL_TOKEN }}
          DRAFT_URL: ${{ steps.draft.outputs.url }}
          S_SMOKE: ${{ steps.smoke.outcome }}
        working-directory: judged
        run: |
          detail="The nightly refresh failed; the last good deploy is still live."
          if [ "$S_SMOKE" = "failure" ]; then detail="The smoke test failed on the draft deploy, so production was not updated; the last good deploy is still live. Draft: $DRAFT_URL"; fi
          uv run --locked python scripts/ci_channel.py alert --title "Nightly data refresh failed" --detail "$detail" --run-url "$RUN_URL"
