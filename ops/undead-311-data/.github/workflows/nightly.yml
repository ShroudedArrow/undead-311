# Nightly data refresh. TEMPLATE: copy this file to `.github/workflows/nightly.yml` in ShroudedArrow/undead-311-data
# (agents have no access to that repo). REQ-OPS-NIGHTLY.1 to .4, REQ-OPS-ALERT.1. Setup steps: ops/undead-311-data/README.md.
#
# Flow (fix/fulldata-2): the pipeline does NOT run here. Each full-data run publishes its exports as a release asset of this
# repo (`exports-<run_id>`: pipeline/scripts/exports_release.py publish). This job checks out the judged repo at the frozen
# release tag, copies judge mode's files from the tag into web/public/data/frozen/ (so judge mode stays on the judging snapshot),
# downloads the newest `exports-*` release asset, verifies its SHA-256 and manifest, unpacks it into web/public/data/, builds the
# site with it and deploys the WHOLE site to Netlify (so data is always served from the site's own origin). The deploy is the
# last step that changes anything public, and a failed night never reaches it, so Netlify keeps the last good deploy. On failure the job writes a failure entry (kept in the release
# `nightly-state`, merged into the next good deploy's status.json `history`) and opens a needs-human alert.
#
# Every action is pinned to a tag and the job sets its own permissions (pipeline/tests/unit/test_workflows_pinned.py).
# Event and variable data reaches scripts through env vars, never inside run text. Secrets used here: NETLIFY_AUTH_TOKEN,
# NETLIFY_SITE_ID (deploy step only) and CHANNEL_TOKEN (alert only), mapped to GITHUB_CHANNEL_TOKEN. The release download uses
# the job's own github.token (same repo), so it needs no extra secret.
name: nightly

on:
  schedule:
    - cron: "41 3 * * *"   # nightly, 03:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh (download exports, build, deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # contents: write is for the failure history in the `nightly-state` release. The exports release is only read.
    permissions:
      contents: write
    env:
      JUDGED_REPO: ShroudedArrow/undead-311
      # A repository variable (Settings, Secrets and variables, Actions, Variables), set once to the freeze tag.
      JUDGED_TAG: ${{ vars.JUDGED_TAG }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DATA_REPO: ${{ github.repository }}
    steps:
      - name: Require the frozen tag
        id: tag
        run: |
          if [ -z "$JUDGED_TAG" ]; then echo "Set the repository variable JUDGED_TAG to the frozen release tag (README.md)." >&2; exit 1; fi

      - name: Check out the judged repo at the frozen tag
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: ShroudedArrow/undead-311
          ref: ${{ vars.JUDGED_TAG }}
          path: judged

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: judged/.nvmrc
          cache: npm
          cache-dependency-path: judged/web/package-lock.json

      - name: Install dependencies
        id: setup
        working-directory: judged
        run: |
          mkdir -p "$UV_CACHE_DIR"
          make setup

      # Judge mode stays on the judging snapshot (REQ-OPS-SNAP.2). The unpacked exports rewrite stats/judge_tour.json,
      # points.json and the card shards, so judge mode's copy is taken from the tag first, into web/public/data/frozen/
      # (a folder the exports never touch), and only if each file matches data/SNAPSHOT.md.
      - name: Freeze the judge-mode files from the tag
        id: freeze
        working-directory: judged
        run: python3 pipeline/scripts/snapshot.py --freeze-judge

      # The newest `exports-*` release of this repo, by creation date (a run that did not pass its own checks is never published:
      # `exports_release.py pack` refuses a status that is not ok or carries a DRY RUN ONLY anomaly).
      - name: Download the newest exports release asset
        id: download
        working-directory: judged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(uv run python pipeline/scripts/exports_release.py latest --repo "$DATA_REPO")"
          echo "exports release: $tag"
          mkdir -p "$RUNNER_TEMP/exports"
          gh release download "$tag" --repo "$DATA_REPO" --dir "$RUNNER_TEMP/exports" --pattern "exports-*.tar.gz" --pattern "exports-*.sha256" --clobber

      - name: Verify and unpack the exports
        id: exports
        working-directory: judged
        run: |
          uv run python pipeline/scripts/exports_release.py unpack --archive "$(ls "$RUNNER_TEMP"/exports/exports-*.tar.gz)" --sha256 "$(ls "$RUNNER_TEMP"/exports/exports-*.sha256)" --dest web/public/data

      # Exports whose status says `ok: false` (or no status) must never be deployed.
      - name: Check the pipeline status
        id: check
        run: python3 judged/ops/undead-311-data/status_history.py check --status judged/web/public/data/status.json

      # The merged status.json is validated against schemas/status.schema.json, which defines `history`.
      - name: Merge earlier failures into status.json history
        id: history
        working-directory: judged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly-state --repo "$DATA_REPO" --pattern failure-history.json --dir "$RUNNER_TEMP" --clobber || echo "no failure history yet"
          uv run python ops/undead-311-data/status_history.py merge --status web/public/data/status.json --history "$RUNNER_TEMP/failure-history.json" --schema schemas/status.schema.json

      # REQ-WEB-LINKS.2 (UX-39): share images need a browser. It is installed inside this step, so a failure is recorded as `build`,
      # and SHARE_IMAGES=required fails the build if no browser starts.
      - name: Build the site with the new data
        id: build
        working-directory: judged
        env:
          SHARE_IMAGES: required
        run: |
          npm --prefix web exec playwright install --with-deps chromium
          make build

      # What is about to ship must still carry the snapshot's judge-mode files, byte for byte.
      - name: Verify the frozen judge-mode files in the built site
        id: verify
        working-directory: judged
        run: python3 pipeline/scripts/snapshot.py --check-frozen --public web/dist/data

      - name: Deploy the whole site (production)
        id: deploy
        working-directory: judged
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.19.0 deploy --prod --dir web/dist --message "nightly $GITHUB_RUN_ID"

      - name: Clear the failure history (the deploy that carries it succeeded)
        id: clear
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 judged/ops/undead-311-data/status_history.py clear --history "$RUNNER_TEMP/failure-history.json"
          gh release view nightly-state --repo "$DATA_REPO" > /dev/null 2>&1 || gh release create nightly-state --repo "$DATA_REPO" --title "nightly state" --notes "Failure history for the nightly refresh. Not a data release."
          gh release upload nightly-state "$RUNNER_TEMP/failure-history.json" --repo "$DATA_REPO" --clobber

      # ---- failure path: the last good deploy stays up; record the failure and alert the team -----------------
      - name: Record the failure for the next good deploy
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          S_TAG: ${{ steps.tag.outcome }}
          S_CHECKOUT: ${{ steps.checkout.outcome }}
          S_SETUP: ${{ steps.setup.outcome }}
          S_FREEZE: ${{ steps.freeze.outcome }}
          S_DOWNLOAD: ${{ steps.download.outcome }}
          S_EXPORTS: ${{ steps.exports.outcome }}
          S_CHECK: ${{ steps.check.outcome }}
          S_HISTORY: ${{ steps.history.outcome }}
          S_BUILD: ${{ steps.build.outcome }}
          S_VERIFY: ${{ steps.verify.outcome }}
          S_DEPLOY: ${{ steps.deploy.outcome }}
          S_CLEAR: ${{ steps.clear.outcome }}
        run: |
          gh release download nightly-state --repo "$DATA_REPO" --pattern failure-history.json --dir "$RUNNER_TEMP" --clobber || echo "no failure history yet"
          python3 judged/ops/undead-311-data/status_history.py record --history "$RUNNER_TEMP/failure-history.json" --run-url "$RUN_URL" --outcomes "tag=$S_TAG" "checkout=$S_CHECKOUT" "setup=$S_SETUP" "freeze=$S_FREEZE" "download=$S_DOWNLOAD" "exports=$S_EXPORTS" "check=$S_CHECK" "history=$S_HISTORY" "build=$S_BUILD" "verify=$S_VERIFY" "deploy=$S_DEPLOY" "clear=$S_CLEAR"
          gh release view nightly-state --repo "$DATA_REPO" > /dev/null 2>&1 || gh release create nightly-state --repo "$DATA_REPO" --title "nightly state" --notes "Failure history for the nightly refresh. Not a data release."
          gh release upload nightly-state "$RUNNER_TEMP/failure-history.json" --repo "$DATA_REPO" --clobber

      - name: Open a needs-human alert in the channel
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GITHUB_CHANNEL_TOKEN: ${{ secrets.CHANNEL_TOKEN }}
        run: python3 judged/scripts/ci_channel.py alert --title "Nightly data refresh failed" --detail "The nightly refresh failed; the last good deploy is still live." --run-url "$RUN_URL"
