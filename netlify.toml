# Netlify build settings (REQ-OPS-HOST.1 to .4). No secret lives here. Account linking is a human step: docs/DEPLOY.md.
#
# The build is web-only. Netlify's build image has Node (version read from .nvmrc) and make, but not `uv`, so the build
# never runs the Python pipeline: the site is built from the data already under web/public/data. `make build` runs
# `cd web && npm run build` (tsc, then vite). Dependencies are installed first because package.json sits in web/, not
# at the repo root where Netlify looks by default.
#
# Headers (REQ-OPS-HOST.3, REQ-OPS-CACHE.1): the target is a `_headers` file the web build writes into web/dist, which
# Netlify reads from the publish directory. No branch generates it yet (haunted-web task 12, credibility layer), so an
# INTERIM same-origin Content-Security-Policy is set below, so that a first deploy never ships without one. When the
# web build writes `_headers`, Netlify gives that file precedence for the same header and path; delete the block then.
# Cache headers (immutable assets, no-cache index.html) are nightly-and-deploy task 5 and are not set here.

[build]
  command = "npm --prefix web ci && make build"
  publish = "web/dist"

# Production deploys come from the branch set in the Netlify UI (main). Deploy previews are built for pull requests.
# Branch deploys are switched off in the UI (docs/DEPLOY.md, step 3), because the toml cannot turn them off.
[context.production]
  command = "npm --prefix web ci && make build"

[context.deploy-preview]
  command = "npm --prefix web ci && make build"

# INTERIM (review N1, ops#53). Same-origin only: no third-party script, font, tile or API host (tech.md). MapLibre and
# deck.gl need blob: workers and data: or blob: images; they and React set inline styles, hence style-src 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
