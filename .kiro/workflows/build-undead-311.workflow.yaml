            onMaxIterations: abort
            stopCondition:
              fileCheck:
                path: .kiro/workflow-runs/{{run_id}}/nightly-and-deploy-demo-critical-loop.json
                jsonPath: $.done
                value: true
            steps:
              - type: step
                id: nightly-and-deploy-demo-critical-implement
                agent: engine
                modelId: claude-sonnet-5.5
                prompt: |
                  Run {{run_id}}, spec nightly-and-deploy, layer demo-critical, step "implement". Follow docs/RUN_PROTOCOL.md. Work only in {{worktree_path}}-engine (branch build/{{run_id}}-engine).
                  First `git merge --no-edit build/{{run_id}}` to pick up the latest integrated work.
                  Read open to:engine findings and .kiro/workflow-runs/{{run_id}}/nightly-and-deploy-demo-critical-review.json if it exists; fix every finding first and close its issue with a commit link.
                  Then implement the next unchecked tasks in .kiro/specs/nightly-and-deploy/tasks.md tagged [demo-critical], in order, citing requirement IDs
                  in docstrings and test names. Tick each task's checkbox when its tests pass. If this layer has no tasks, say so and change nothing.
                  Commit after each task with the Kiro-Agent: engine and Kiro-Run: {{run_id}} trailers.
              - type: step
                id: nightly-and-deploy-demo-critical-validate
                agent: engine
                modelId: claude-sonnet-5.5
                prompt: |
                  Run {{run_id}}, spec nightly-and-deploy, layer demo-critical, step "validate". Follow docs/RUN_PROTOCOL.md. Do not edit code in this step.
                  Run `python3 scripts/validate_gate.py --cwd {{worktree_path}}-engine --out .kiro/workflow-runs/{{run_id}}/nightly-and-deploy-demo-critical-gate.json --target test --target lint` and report the status.
              - type: step
