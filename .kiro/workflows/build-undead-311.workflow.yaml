                  Write .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-review.json as {"verdict": "APPROVED"|"CHANGES_REQUESTED", "findings": [...]}, file each finding as an issue labeled
                  to:engine and type:finding, then run
                  `python3 scripts/loop_status.py --gate .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-gate.json --review .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-review.json --out .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-loop.json`.
          - type: step
            id: skeptic-review
            agent: skeptic
            modelId: claude-opus-5.5
            effortLevel: high
            prompt: |
              Run {{run_id}}, step "skeptic-review". Follow docs/RUN_PROTOCOL.md. Work only in {{worktree_path}}-engine.
              Run `make pipeline` there (or `make pipeline-sample` if full data is absent) so $DATA_DIR/processed/skeptic_input.json is current.
              For every zombie in it, argue it is a coincidence with concrete evidence from both case records (and baseline_p when present):
              new unrelated problem, different issue at the same spot, duplicate report, data error. Write
              data/labels/skeptic_objections.json ({incident_id, resurrection_id, objections:[{kind, evidence}], verdict}), never naming
              individuals. Commit only that file with the Kiro-Agent: skeptic and Kiro-Run: {{run_id}} trailers.
          - type: repeat
            id: nightly-and-deploy-demo-critical-loop
