# Build The Undead 311 from the approved specs in .kiro/specs/ (prompts/04-workflow.md).
# Layer order (docs/PROJECT.md cut lines): ALL demo-critical tasks first (by Nov 17), then credibility (by Nov 22), then delight.
# Each layer runs the engine branch (zombie-engine -> durability-stats -> nightly-and-deploy; in the demo-critical layer a
# coroner-label step follows zombie-engine and a skeptic-review step follows durability-stats) and the web branch (haunted-web)
# in parallel, in separate worktrees with disjoint file ownership, then integrates. Every spec loop: implement (faster model)
# -> deterministic validate gate (scripts/validate_gate.py) -> reviewer on a DIFFERENT, stronger model -> loop file
# (scripts/loop_status.py). Stop conditions are files; the channel (ShroudedArrow/undead-311-ops) is the audit trail.
# Prerequisites: specs approved; pipeline/tests/fixtures/expected_zombies.json hand-written by the owner; docs/PREFLIGHT.md A done.
# Launch inputs: run_id (e.g. build-2026-11-14a), worktree_path (e.g. .local-data/worktrees/<run_id>).
# Model IDs are set here only; change them in one place if the account lists different IDs.
name: build-undead-311
description: Implement the approved specs layer by layer (demo-critical, credibility, delight) with test gates, cross-model reviews, a design gate, a preview, a retro and a report.
inputs:
  run_id: string
  worktree_path: string
modelId: claude-sonnet-5.5
steps:
  - type: step
    id: setup
    agent: engine
    modelId: claude-sonnet-5.5
    prompt: |
      Run {{run_id}}, step "setup". Follow docs/RUN_PROTOCOL.md.
      0. Channel first: create .kiro/workflow-runs/{{run_id}}/ in the main checkout with a RUNNING marker file. Open the run-log issue
         "Run {{run_id}}: build-undead-311" (label type:status) in ShroudedArrow/undead-311-ops through the github-channel MCP server
         and save {"issue": <number>, "url": "<html_url>"} to .kiro/workflow-runs/{{run_id}}/channel.json
         (fallback: `python3 scripts/channel_open.py --run-id {{run_id}} --recipe build-undead-311`). Every later step starts by
         reading open issues labeled to:<its role> and ends with one status comment there.
      1. Abort unless pipeline/tests/fixtures/expected_zombies.json exists and is committed (a person writes it before the run; agents
         never edit it). If it is missing: write .kiro/workflow-runs/{{run_id}}/setup.json with {"ok": false, "reason": "..."},
         post to the run log, and call send_message with severity error.
      2. Create the run worktree: `git worktree add -b build/{{run_id}} {{worktree_path}} HEAD`.
      3. In it, scaffold ALL shared files first, so the parallel branches never collide: pyproject.toml dependencies named by the
         specs' designs, web/package.json (Vite + React + TS, vitest, fast-check, Playwright) and package-lock.json, Makefile targets
         from structure.md (stubs allowed), /schemas/ with every JSON Schema the designs list, web/src/copy/en.json with TODO-COPY
         placeholders, and confirm the test-town CASES (pipeline/tests/fixtures/test_town.csv) are present and unchanged.
         Commit with the Kiro-Agent: engine and Kiro-Run: {{run_id}} trailers.
      4. Create the two branch worktrees from that commit:
         `git worktree add -b build/{{run_id}}-engine {{worktree_path}}-engine build/{{run_id}}` and
         `git worktree add -b build/{{run_id}}-web {{worktree_path}}-web build/{{run_id}}`.
      5. Write .kiro/workflow-runs/{{run_id}}/setup.json: {"ok": true, "base": "<sha>", "worktrees": {...},
         "ownership": {"engine": ["pipeline/", "schemas/", "data/sample/", ".github/", ".devcontainer/", "Makefile", "pyproject.toml",
         "uv.lock", "docs/METHODS.md", "docs/VALIDATION.md"], "web": ["web/", "docs/screenshots/"]}}.
         Edits outside a branch's ownership list are forbidden; reviewers treat them as findings.
  # ---------- Layer 1: demo-critical (by Tue Nov 17) ----------
  - type: parallel
    id: demo-critical-parallel
    joinPolicy: all
    branches:
      - type: sequence
        id: demo-critical-engine-branch
        steps:
          - type: repeat
            id: zombie-engine-demo-critical-loop
            maxIterations: 3
            onMaxIterations: abort
            stopCondition:
              fileCheck:
                path: .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-loop.json
                jsonPath: $.done
                value: true
            steps:
              - type: step
                id: zombie-engine-demo-critical-implement
                agent: engine
                modelId: claude-sonnet-5.5
                prompt: |
                  Run {{run_id}}, spec zombie-engine, layer demo-critical, step "implement". Follow docs/RUN_PROTOCOL.md. Work only in {{worktree_path}}-engine (branch build/{{run_id}}-engine).
                  First `git merge --no-edit build/{{run_id}}` to pick up the latest integrated work.
                  Read open to:engine findings and .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-review.json if it exists; fix every finding first and close its issue with a commit link.
                  Then implement the next unchecked tasks in .kiro/specs/zombie-engine/tasks.md tagged [demo-critical], in order, citing requirement IDs
                  in docstrings and test names. Tick each task's checkbox when its tests pass. If this layer has no tasks, say so and change nothing.
                  Commit after each task with the Kiro-Agent: engine and Kiro-Run: {{run_id}} trailers.
              - type: step
                id: zombie-engine-demo-critical-validate
                agent: engine
                modelId: claude-sonnet-5.5
                prompt: |
                  Run {{run_id}}, spec zombie-engine, layer demo-critical, step "validate". Follow docs/RUN_PROTOCOL.md. Do not edit code in this step.
                  Run `python3 scripts/validate_gate.py --cwd {{worktree_path}}-engine --out .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-gate.json --target test --target lint` and report the status.
              - type: step
                id: zombie-engine-demo-critical-review
                agent: reviewer-stats
                modelId: claude-opus-5.5
                effortLevel: high
                prompt: |
                  Run {{run_id}}, spec zombie-engine, layer demo-critical, step "review". Follow docs/RUN_PROTOCOL.md. You are read-only except your review file.
                  Review the commits on build/{{run_id}}-engine since the last review (`git log`, `git diff`) against .kiro/specs/zombie-engine/requirements.md and design.md,
                  for the [demo-critical] tasks. Check formulas and edge cases against methods.md and zombie-definition.md, that every requirement in this layer has a test citing its ID, and that the property tests named in the spec's design (testing.md numbers) exist and are not weakened.
                  Run `python3 scripts/check_trailers.py build/{{run_id}}..build/{{run_id}}-engine --require-run {{run_id}}`; missing trailers are a finding.
                  If .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-gate.json is not PASS, the verdict must be CHANGES_REQUESTED.
                  Write .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-review.json as {"verdict": "APPROVED"|"CHANGES_REQUESTED", "findings": [...]}, file each finding as an issue labeled
                  to:engine and type:finding, then run
                  `python3 scripts/loop_status.py --gate .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-gate.json --review .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-review.json --out .kiro/workflow-runs/{{run_id}}/zombie-engine-demo-critical-loop.json`.
          - type: step
            id: coroner-label
            agent: coroner
            modelId: claude-sonnet-5.5
            prompt: |
              Run {{run_id}}, step "coroner-label". Follow docs/RUN_PROTOCOL.md. Work only in {{worktree_path}}-engine.
              Run `make pipeline-sample` there if $DATA_DIR/processed/coroner_templates.csv doesn't exist. Then label the templates in
              coroner_templates.csv in order of n_cases until labeled templates cover at least 95% of in-scope closed cases (the rest stay
              unlabeled and count as `other`). Write data/labels/coroner_labels.csv (template,label,rationale) with only the nine allowed
              labels, keeping existing rows unchanged. Commit only that file with the Kiro-Agent: coroner and Kiro-Run: {{run_id}} trailers.
              Write the coverage share to .kiro/workflow-runs/{{run_id}}/coroner.json.
          - type: repeat
            id: durability-stats-demo-critical-loop
            maxIterations: 3
            onMaxIterations: abort
            stopCondition:
              fileCheck:
                path: .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-loop.json
                jsonPath: $.done
                value: true
            steps:
              - type: step
                id: durability-stats-demo-critical-implement
                agent: engine
                modelId: claude-sonnet-5.5
                prompt: |
                  Run {{run_id}}, spec durability-stats, layer demo-critical, step "implement". Follow docs/RUN_PROTOCOL.md. Work only in {{worktree_path}}-engine (branch build/{{run_id}}-engine).
                  First `git merge --no-edit build/{{run_id}}` to pick up the latest integrated work.
                  Read open to:engine findings and .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-review.json if it exists; fix every finding first and close its issue with a commit link.
                  Then implement the next unchecked tasks in .kiro/specs/durability-stats/tasks.md tagged [demo-critical], in order, citing requirement IDs
                  in docstrings and test names. Tick each task's checkbox when its tests pass. If this layer has no tasks, say so and change nothing.
                  Commit after each task with the Kiro-Agent: engine and Kiro-Run: {{run_id}} trailers.
              - type: step
                id: durability-stats-demo-critical-validate
                agent: engine
                modelId: claude-sonnet-5.5
                prompt: |
                  Run {{run_id}}, spec durability-stats, layer demo-critical, step "validate". Follow docs/RUN_PROTOCOL.md. Do not edit code in this step.
                  Run `python3 scripts/validate_gate.py --cwd {{worktree_path}}-engine --out .kiro/workflow-runs/{{run_id}}/durability-stats-demo-critical-gate.json --target test --target lint` and report the status.
              - type: step
                id: durability-stats-demo-critical-review
                agent: reviewer-stats
                modelId: claude-opus-5.5
                effortLevel: high
                prompt: |
                  Run {{run_id}}, spec durability-stats, layer demo-critical, step "review". Follow docs/RUN_PROTOCOL.md. You are read-only except your review file.
                  Review the commits on build/{{run_id}}-engine since the last review (`git log`, `git diff`) against .kiro/specs/durability-stats/requirements.md and design.md,
                  for the [demo-critical] tasks. Check formulas and edge cases against methods.md and zombie-definition.md, that every requirement in this layer has a test citing its ID, and that the property tests named in the spec's design (testing.md numbers) exist and are not weakened.
                  Run `python3 scripts/check_trailers.py build/{{run_id}}..build/{{run_id}}-engine --require-run {{run_id}}`; missing trailers are a finding.
