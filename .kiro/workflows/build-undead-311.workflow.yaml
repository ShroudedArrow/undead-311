  - type: step
    id: integrate-demo-critical
    agent: engine
    modelId: claude-sonnet-5.5
    prompt: |
      Run {{run_id}}, step "integrate-demo-critical". Follow docs/RUN_PROTOCOL.md. Work in {{worktree_path}} (branch build/{{run_id}}).
      Merge build/{{run_id}}-engine and build/{{run_id}}-web into build/{{run_id}} with `git merge --no-edit` (file ownership keeps them
      disjoint; if a conflict appears anyway, stop and post a needs-human proposal). Then run `make pipeline-sample` (the pipeline on data/sample) and `make build`.
