                agent: reviewer-ux
                modelId: claude-opus-5.5
                effortLevel: high
                prompt: |
                  Run {{run_id}}, spec haunted-web, layer demo-critical, step "review". Follow docs/RUN_PROTOCOL.md. You are read-only except your review file.
                  Review the commits on build/{{run_id}}-web since the last review (`git log`, `git diff`) against .kiro/specs/haunted-web/requirements.md and design.md,
                  for the [demo-critical] tasks. Build the site (`make build`) and use Playwright to screenshot the pages this layer touched into docs/screenshots/{{run_id}}/. Check design-system.md (every Banned default), voice.md (TODO-COPY placeholders are allowed), accessibility basics, and answer 'If the name were removed, could this be any generic dashboard?' (yes = CHANGES_REQUESTED).
                  Run `python3 scripts/check_trailers.py build/{{run_id}}..build/{{run_id}}-web --require-run {{run_id}}`; missing trailers are a finding.
                  If .kiro/workflow-runs/{{run_id}}/haunted-web-demo-critical-gate.json is not PASS, the verdict must be CHANGES_REQUESTED.
                  Write .kiro/workflow-runs/{{run_id}}/haunted-web-demo-critical-review.json as {"verdict": "APPROVED"|"CHANGES_REQUESTED", "findings": [...]}, file each finding as an issue labeled
