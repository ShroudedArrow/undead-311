  - type: step
    id: preview
    agent: wf-pr-submitter
    modelId: claude-sonnet-5.5
    prompt: |
      Run {{run_id}}, step "preview". Follow docs/RUN_PROTOCOL.md.
      Push branch build/{{run_id}} (normal push, never force) and open a pull request into main titled
      "Build {{run_id}}: demo-critical, credibility, delight layers" using the REST API (`gh api repos/ShroudedArrow/undead-311/pulls ...`),
      body = the run log link from .kiro/workflow-runs/{{run_id}}/channel.json plus the per-layer loop results. The PR's deploy preview
      (static host from the nightly-and-deploy spec) is the preview URL; wait up to 10 minutes for it. If no hosted preview exists,
      record that and use `npm run preview` in {{worktree_path}}/web as the local preview. Write {"pr": "<url>", "preview": "<url or local>"}
      to .kiro/workflow-runs/{{run_id}}/preview.json and post the preview link to the run-log issue. Never merge.
  - type: step
    id: preview-review
    agent: reviewer-ux
    modelId: claude-opus-5.5
    effortLevel: high
    prompt: |
      Run {{run_id}}, step "preview-review". Follow docs/RUN_PROTOCOL.md. Read-only except your review file.
      Run your Playwright review against the URL in .kiro/workflow-runs/{{run_id}}/preview.json (judge-mode tour end to end, no login,
      "Data as of" visible, footer text, no third-party requests at runtime). Write .kiro/workflow-runs/{{run_id}}/preview-review.json
      and file findings as to:web type:finding issues (they are fixed in the next run; this step does not loop).
  - type: step
    id: retro
    agent: engine
    modelId: claude-sonnet-5.5
    prompt: |
      Run {{run_id}}, step "retro". Follow docs/RUN_PROTOCOL.md.
      Read the run-log issue and every file in .kiro/workflow-runs/{{run_id}}/. Add at most three one-line entries to docs/LEARNINGS.md
      (gotchas only: data quirks, library traps, failed approaches), and draft one candidate line for the Kiro write-up in
      .kiro/workflow-runs/{{run_id}}/writeup-candidate.md. Commit on build/{{run_id}} with the trailers.
  - type: step
    id: report
    agent: engine
    modelId: claude-sonnet-5.5
    prompt: |
      Run {{run_id}}, step "report". Follow docs/RUN_PROTOCOL.md.
      Write .kiro/workflow-runs/{{run_id}}/report.md: what was built per spec and layer (tasks checked vs. total), loop iterations,
      failing items, open findings, the preview link, the trailer check over build/{{run_id}}, and next steps. Append one line to
      docs/KIRO_LOG.md (kiro-log.md format). Post the summary as the final run-log comment, close the run-log issue, delete the
      RUNNING marker, and leave the PR for the human to review and merge.
