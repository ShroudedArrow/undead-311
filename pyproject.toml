[project]
name = "undead311"
version = "0.0.1"
description = "The Undead 311: find Boston 311 cases that were closed and then re-reported."
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "jsonschema>=4.21",   # export contracts (zombie-engine design)
    "numpy>=1.26",        # durability-stats: seeded resampling
    "scipy>=1.11",        # durability-stats: beta-binomial, binomial quantiles
    "statsmodels>=0.14",  # tech.md statistics
    "lifelines>=0.28",    # durability-stats: Kaplan-Meier
    "shapely>=2.0",       # zombie-engine: segment snapping fallback when DuckDB spatial is unavailable
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "hypothesis>=6",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
src = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline", "pipeline/tests"]
# A test module that cannot be imported is an error (pytest exit code 2), and an uncollectable Test* class is too.
filterwarnings = ["error::pytest.PytestCollectionWarning"]
