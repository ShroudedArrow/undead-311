[project]
name = "undead311"
version = "0.0.1"
description = "The Undead 311: find Boston 311 cases that were closed and then re-reported."
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "hypothesis>=6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
src = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline"]
